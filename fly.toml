# fly.toml app configuration file generated for tigerblue-frontend on 2025-12-18T08:49:08Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'tigerblue-frontend'
primary_region = 'ams'

[build]
  [build.args]
    NEXT_PUBLIC_POSTGREST_BASE = "https://tigerblue-postgrest.fly.dev"
    NEXUS_BASE = "https://cyberscape-nexus.fly.dev"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
